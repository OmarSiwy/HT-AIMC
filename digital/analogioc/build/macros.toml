# Analog hard macros instantiated by the digital top analogioc_top. Declared once here:
#   - harden (build/librelane, `make config`) takes gds + lef + lib + blackbox
#   - simulation (build/verification, build/des_tb) takes the behavioural model
#   - `python3 macros.py check macros.toml` fails if the blackbox, the behavioural
#     model and the .subckt disagree on ports
#
# Default views of block <b>, relative to analog_root:
#   <b>/output/gds/<b>.gds   <b>/output/lef/<b>.lef   <b>/output/lib/<b>__<corner>.lib (optional; one per corner from `gpurify lib`)
#   <b>/output/verilog/<b>.v (* blackbox *), no power pins
#   <b>/va/<b>_beh.v         behavioural Verilog, same module name and ports
#   <b>/netlist/<b>.spice    .subckt <b>: signal ports + every supply pin
# Override any of them under [macro.views], relative to this file.
analog_root = "../../../analog"

[[macro]]
block = "analogioc"
# Ports: analog/analogioc/netlist/analogioc.ports (contract: analog/analogioc/docs/INTERFACE.md).
# 37 signal ports (501 bits) + 5 analog supplies. w_wl/w_data (weight write, INTERFACE.md §7)
# are plain digital pins: not analog_nets. The macro has NO digital supply pins:
# its sequencer logic runs on its own `vdd`, kept off VPWR/VGND like the other analog rails
# (INTERFACE.md §2, Q9).
halo = [10, 10]
pg = []
analog_supplies = ["vdd", "vdd_ota", "vdd_cmp", "vdd_pkt", "vss"]  # kept OFF the digital PDN
# Top-level nets on the macro's analog pins: never buffered/resized.
analog_nets = ["vcm", "vr[np]_(thrp|thrn|sarp|sarn)", "vb_(nc|pc|tail|ramp)"]

[macro.instances.u_analogioc]
# PLACEHOLDER: the macro size is unknown until output/lef/analogioc.lef exists (its SIZE).
# Place it inside build/librelane/config.yaml's DIE_AREA (also a placeholder) with room
# for the std cells and the 13 analog + 5 supply pins' routing to the die edge.
location = [100, 100]
orientation = "N"

[macro.views]
# Produced by the analog flow (analog/*/output/ is gitignored), see `make -C digital/analogioc flow`:
#   gds, lef  make -C analog/analogioc/build/layout views   (verified layout -> macro views)
#   lib       make -C analog/analogioc/build/lib lib        (gpurify: analogioc__<corner>.lib)
gds = "../../../analog/analogioc/output/gds/analogioc.gds"
lef = "../../../analog/analogioc/output/lef/analogioc.lef"
lib = "../../../analog/analogioc/output/lib"
# Committed: the blackbox (same ports as the behavioural model; gpurify's own
# output/lib/analogioc.v carries the supplies under USE_POWER_PINS and is not used),
# the behavioural model, and the .subckt (a ports-only stub until the real top lands).
blackbox = "../../../analog/analogioc/va/analogioc.v"
behavioural = "../../../analog/analogioc/va/analogioc_beh.v"
subckt = "../../../analog/analogioc/netlist/analogioc.spice"
