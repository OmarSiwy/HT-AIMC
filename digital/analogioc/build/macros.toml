# Analog hard macros instantiated by the digital top analogioc. Declared once here:
#   - harden (build/librelane, `make config`) takes gds + lef + lib + blackbox
#   - simulation (build/verification, build/des_tb) takes the behavioural model
#   - `python3 macros.py check macros.toml` fails if the blackbox, the behavioural
#     model and the .subckt disagree on ports
#
# Default views of block <b>, relative to analog_root:
#   <b>/output/gds/<b>.gds   <b>/output/lef/<b>.lef   <b>/output/lib/<b>.lib (optional, gap 2)
#   <b>/output/verilog/<b>.v (* blackbox *), no power pins
#   <b>/va/<b>_beh.v         behavioural Verilog, same module name and ports
#   <b>/netlist/<b>.spice    .subckt <b>: signal ports + every supply pin
# Override any of them under [macro.views], relative to this file.
analog_root = "../../../analog"

[[macro]]
block = "analogioc"
# Ports: analog/analogioc/netlist/analogioc.ports (contract: analog/analogioc/docs/INTERFACE.md).
# 37 signal ports (501 bits) + 5 analog supplies. w_wl/w_data (weight write, INTERFACE.md §7)
# are plain digital pins: not analog_nets. The macro has NO digital supply pins:
# its sequencer logic runs on its own `vdd`, kept off VPWR/VGND like the other analog rails.
# TODO (phase 2, analog top): output/gds, output/lef, output/lib (optional) do not exist
# yet, so `make config`/`make harden` stop at the missing gds. netlist/analogioc.spice is a
# ports-only STUB generated from analogioc.ports; the real netlist replaces it.
halo = [10, 10]
pg = []
analog_supplies = ["vdd", "vdd_ota", "vdd_cmp", "vdd_pkt", "vss"]  # kept OFF the digital PDN
# Top-level nets on the macro's analog pins: never buffered/resized.
analog_nets = ["vcm", "vr[np]_(thrp|thrn|sarp|sarn)", "vb_(nc|pc|tail|ramp)"]

[macro.instances.u_analogioc]
location = [70, 60]   # TODO: real placement (non-TT analogioc_top floorplan)
orientation = "N"

[macro.views]
# committed blackbox (analog/*/output/ is gitignored), same ports as the behavioural model
blackbox = "../../../analog/analogioc/va/analogioc.v"
